# Pinned tools and build tasks. The checks run on your machine, not in CI. A push to main starts a
# Cloudflare Workers Build that deploys the site (see docs/development/release.md).
# Setup: `mise install` (it also installs the git hooks), `brew install cargo-deny cargo-shear
# typos-cli`. Check: `mise run check` (fast: `mise run check:fast`).
min_version = "2026.10.5"

[tools]
# The CLI that makes the JS glue for crates/atelier-wasm. Keep it equal to wasm-bindgen in Cargo.lock.
"cargo:wasm-bindgen-cli" = "0.2.130"
lefthook = "2.2.2"

# Runs after `mise install`, so a fresh clone gets the git hooks of lefthook.yml with no git config.
[hooks]
postinstall = "lefthook install"

[settings]
lockfile = true
# Rust comes from rust-toolchain.toml.
idiomatic_version_file_enable_tools = ["rust"]

[tasks.setup]
description = "Install the git hooks of lefthook.yml (`mise install` does it too)"
run = "lefthook install"

[tasks.check]
description = "The one check (fmt, clippy, tests, deny, typos, shear, web types and Biome)"
run = "bash scripts/test-all.sh"

[tasks."check:fast"]
description = "The fast check while you work: fmt, clippy, the Rust tests, web types and Biome"
run = "bash scripts/test-all.sh --fast"

# The web app (app/web): Hero UI and React over the Rust core in wasm. See app/web/README.md.

[tasks."web:install"]
description = "Install the web dependencies from the lockfile"
run = "pnpm --dir app/web install --frozen-lockfile"

[tasks."web:wasm"]
description = "Build crates/atelier-wasm and its JS glue into app/web/wasm"
run = "bash app/web/scripts/build-wasm.sh"

[tasks."web:brand"]
description = "Make the favicons and share images from app/web/brand/logo.svg"
depends = ["web:install"]
run = "node app/web/scripts/brand.mjs"

[tasks."web:dev"]
description = "Run the web app in the browser (builds the wasm first)"
depends = ["web:wasm", "web:install"]
run = "pnpm --dir app/web dev"

[tasks."web:build"]
description = "Type check and build the web app"
depends = ["web:wasm", "web:install"]
run = "pnpm --dir app/web build"

[tasks."web:e2e"]
description = "Headless Chromium tests of the web app (starts Vite itself, or uses the one on :5173). PHOTOS_DIR must hold mona-lisa-2400.jpg (docs/development/testing.md)"
depends = ["web:wasm", "web:install"]
run = "pnpm --dir app/web exec playwright test"

[tasks."web:golden:bless"]
description = "Rewrite the golden pictures of e2e/golden (only for a meant change; say why in the commit)"
depends = ["web:wasm", "web:install"]
run = "rm -rf app/web/e2e/golden && GOLDEN_BLESS=1 pnpm --dir app/web exec playwright test golden.spec.ts"

# Deploy: Cloudflare Worker `atelier` at atelier.stevanpavlovic.com. A push to main deploys it;
# `mise run deploy` is the manual deploy. The account is pinned in wrangler.jsonc, and
# scripts/deploy.sh stops on any other.

[tasks.deploy]
description = "Build the web app, deploy it to Cloudflare and probe the live site"
run = "bash scripts/deploy.sh"

[tasks.release]
description = "The whole release in one run: check, e2e, built-app smoke test, deploy, live smoke test"
run = "bash scripts/release.sh"
