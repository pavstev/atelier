[workspace]
resolver = "3"
members = ["crates/atelier-core", "crates/atelier-wasm", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
repository = "https://github.com/pavstev/atelier"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
atelier-core = { path = "crates/atelier-core" }
png = "=0.18.1"
libm = "=0.2.16"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

# uv's pedantic recipe, plus typst's iter_over_hash_type, so output never depends on hash map order.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
missing_panics_doc = "allow"
# Module paths like `filter::median_blur` read well; repeating the module is fine.
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Image kernels are long loops with similar names by nature.
too_many_lines = "allow"
similar_names = "allow"
# Pixel code casts between u8, i32, f32 and usize all the time; each cast is range checked by design.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
many_single_char_names = "allow"
# Settings is a small Copy struct passed by reference through the public API.
trivially_copy_pass_by_ref = "allow"
naive_bytecount = "allow"
assert_is_empty = "allow"
# Seeds and hash constants are clearer unbroken.
unreadable_literal = "allow"
# `as_chunks` needs const sizes we do not have at every call site.
chunks_exact_to_as_chunks = "allow"
print_stdout = "warn"
dbg_macro = "warn"
get_unwrap = "warn"
use_self = "warn"
iter_over_hash_type = "warn"

[profile.dev]
opt-level = 2
# File and line in panics, no full debug info: a clean build takes 30 s instead of 34 s and
# target/ is 137 MB smaller.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
